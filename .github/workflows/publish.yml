name: publish-feed
on:
  schedule:
    # Every day so weekend and holiday reads stay fresh: 11:30 UTC (04:30 PDT / 03:30 PST).
    - cron: "30 11 * * *"
    # Weekday mid-morning refresh: 15:45 UTC (08:45 PDT / 07:45 PST).
    - cron: "45 15 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml', 'feed_pipeline/**']
permissions:
  contents: write
concurrency:
  group: publish-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - run: python3 -m unittest discover -s tests -t .
      - name: Build feed (health is written even when the feed is invalid)
        id: build
        run: python3 -m feed_pipeline.build --out feed
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        continue-on-error: true
      - name: Collect bounded FRED v2 release context
        run: python3 -m feed_pipeline.releases
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python3 scripts/privacy_check.py
      - name: Commit changed feed files
        run: |
          git config user.name "agentic-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/
          if git diff --cached --quiet; then echo "No feed changes"; exit 0; fi
          git commit -m "feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another commit can land on main while this run builds (a delayed schedule, a merge). Rebase the feed-only
          # commit onto it and retry, instead of failing the run with a rejected push.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing onto the latest main"
            # A conflict can only be in feed/: a newer feed was already published, so keep that one.
            if ! git pull --rebase origin main; then git rebase --abort; echo "a newer feed is already on main"; exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Fail the run if the feed was not built
        if: steps.build.outcome != 'success'
        run: exit 1
